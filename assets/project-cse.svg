<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc"><title id="title">CSE Stock Insight</title><desc id="desc">Concept illustration of a mobile data application; chart is decorative sample data.</desc><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#263B4B" stroke-width="1" opacity=".42"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1B2A"/><stop offset="1" stop-color="#102F39"/></linearGradient><linearGradient id="line"><stop stop-color="#70E1CB"/><stop offset="1" stop-color="#CFB981"/></linearGradient></defs><rect width="1200" height="240" rx="16" fill="url(#bg)"/><rect x="670" width="530" height="240" rx="16" fill="url(#grid)"/><rect x="0" y="43" width="4" height="154" fill="#70E1CB"/><text x="40" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2.5" font-weight="600" fill="#70E1CB">03 / ANDROID + DATA</text><text x="38" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="650" letter-spacing="-1" fill="#F2F5F4">Complex data. Clear views.</text><text x="40" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#B9CCD4">Company fundamentals, charts and watchlists.</text><path d="M40 191h34" stroke="#CFB981" stroke-width="3"/><g transform="translate(750 30)"><rect width="345" height="181" rx="14" fill="#142D3A" stroke="#3E6470"/><text x="22" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="1" fill="#B9CCD4">DATA EXPLORER</text><path d="M24 68H320M24 104H320M24 140H320" stroke="#2E4A59"/><path d="M25 131L65 111L98 121L139 74L176 97L211 64L249 82L281 55L319 68" fill="none" stroke="#70E1CB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="319" cy="68" r="5" fill="#CFB981"/><rect x="23" y="157" width="52" height="4" rx="2" fill="#527681"/><rect x="87" y="157" width="32" height="4" rx="2" fill="#527681"/></g></svg>
