<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc"><title id="title">AutoQA</title><desc id="desc">Concept illustration of an explore, validate and report workflow.</desc><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#263B4B" stroke-width="1" opacity=".42"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1B2A"/><stop offset="1" stop-color="#102F39"/></linearGradient><linearGradient id="line"><stop stop-color="#70E1CB"/><stop offset="1" stop-color="#CFB981"/></linearGradient></defs><rect width="1200" height="240" rx="16" fill="url(#bg)"/><rect x="670" width="530" height="240" rx="16" fill="url(#grid)"/><rect x="0" y="43" width="4" height="154" fill="#70E1CB"/><text x="40" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2.5" font-weight="600" fill="#70E1CB">01 / AI + SOFTWARE QUALITY</text><text x="38" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="650" letter-spacing="-1" fill="#F2F5F4">Evidence before conclusions.</text><text x="40" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#B9CCD4">Browser exploration. Repeatable findings.</text><path d="M40 191h34" stroke="#CFB981" stroke-width="3"/><g transform="translate(708 73)" font-family="Segoe UI, Arial, sans-serif"><path d="M60 50H360" stroke="#4F7B85" stroke-width="2" stroke-dasharray="5 7"/><rect x="0" width="118" height="94" rx="12" fill="#163442" stroke="#486674"/><text x="59" y="36" text-anchor="middle" font-size="18" fill="#70E1CB">01</text><text x="59" y="65" text-anchor="middle" font-size="17" fill="#EDF4F2">Explore</text><rect x="150" width="118" height="94" rx="12" fill="#163442" stroke="#70E1CB"/><text x="209" y="36" text-anchor="middle" font-size="18" fill="#70E1CB">02</text><text x="209" y="65" text-anchor="middle" font-size="17" fill="#EDF4F2">Validate</text><rect x="300" width="118" height="94" rx="12" fill="#163442" stroke="#486674"/><text x="359" y="36" text-anchor="middle" font-size="18" fill="#70E1CB">03</text><text x="359" y="65" text-anchor="middle" font-size="17" fill="#EDF4F2">Report</text></g></svg>
