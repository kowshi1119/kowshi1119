name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/style_snake.py"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate animation from actual contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Add the isometric presentation
        run: python3 scripts/style_snake.py dist/github-snake.svg dist/contribution-snake.svg
      - name: Publish generated assets
        shell: bash
        run: |
          set -euo pipefail
          # The output branch already exists; preserve its history and other files.
          git fetch origin output
          git worktree add --detach "$RUNNER_TEMP/profile-output" origin/output
          cp dist/*.svg "$RUNNER_TEMP/profile-output/"
          cd "$RUNNER_TEMP/profile-output"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg contribution-snake.svg
          if git diff --cached --quiet; then
            echo "Contribution artwork is already current."
          else
            git commit -m "Refresh contribution snake artwork"
            git push origin HEAD:output
          fi
